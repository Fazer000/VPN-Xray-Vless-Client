name: Build & Release Xray VPN

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew || true

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare Release Assets
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/release/*.apk release-assets/VPN-Xray-Client.apk || true

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xray-vpn-release-apk
          path: release-assets/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Release v1.0.{0}', github.run_number) }}
          body: |
            ## Xray VPN Client Release
            Build: #${{ github.run_number }}
            Commit: ${{ github.sha }}
            
            ### Downloads
            - **VPN-Xray-Client.apk** - Ready to install Android APK
          files: release-assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

